[workspace]
resolver = "3"
members = ["crates/migration", "crates/entity", "crates/sources", "crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
entity = { path = "crates/entity" }
migration = { path = "crates/migration" }
sources = { path = "crates/sources" }
tally-core = { path = "crates/core" }

sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "cli"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
jiff = "1.0"
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
csv = "1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = "0.14"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tonic-web = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
anyhow = "1"
